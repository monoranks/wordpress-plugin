name: Tests

# The only definition of the suite. Runs on every pull request, and deploy.yml calls it on a published release so a
# deploy cannot start until the same suite is green on the release commit. No push trigger: a pull request is already
# tested against the merge result, and a release runs the suite again.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -not -path './packages/*' -print0 | xargs -0 -n1 php -l

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  app:
    name: Admin app builds and matches the committed bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: build/ is committed and up to date (run npm run build and commit it)
        run: git diff --exit-code --stat build

  plugin-check:
    name: WordPress.org plugin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction
      - name: Plugin files only, in a folder named after the slug
        run: mkdir -p tmp && rsync -a --exclude-from=.distignore ./ tmp/monoranks/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: tmp/monoranks

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          H=$(grep -oE 'Version:\s+[0-9.]+' monoranks.php | awk '{print $2}')
          C=$(grep -oE "MONORANKS_CONNECTOR_VERSION', '[0-9.]+'" monoranks.php | grep -oE '[0-9.]+' | tail -1)
          R=$(grep -oE 'Stable tag: [0-9.]+' readme.txt | awk '{print $3}')
          echo "header $H constant $C readme $R"
          test "$H" = "$C" -a "$H" = "$R"
          grep -q "^## \[$H\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $H"; exit 1; }
          grep -q "^= $H =" readme.txt || { echo "readme.txt changelog has no entry for $H"; exit 1; }

  browser:
    name: Chromium on WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress with the plugin
        run: npx wp-env start
      - name: Pretty permalinks (the REST routes live under /wp-json/)
        run: npx wp-env run cli wp rewrite structure '/%postname%/' --hard
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results
          retention-days: 7
