# One pipeline. Every push and pull request: PHP syntax on the versions the plugin supports, unit tests, the
# WordPress.org plugin checker on a slug-named build folder, a version consistency check, and Chromium tests against a
# real WordPress (wp-env). A tag v<version> runs the same jobs and, only when all of them passed, deploys that version
# to the WordPress.org directory (secrets SVN_USERNAME / SVN_PASSWORD) and attaches the zip to the GitHub release.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -not -path './deps/*' -print0 | xargs -0 -n1 php -l
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction
      - name: Plugin files only, in a folder named after the slug
        run: mkdir -p build && rsync -a --exclude-from=.distignore ./ build/monoranks/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/monoranks
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header, constant, readme and changelog agree on the version
        run: |
          H=$(grep -oE 'Version:\s+[0-9.]+' monoranks.php | awk '{print $2}')
          C=$(grep -oE "MONORANKS_CONNECTOR_VERSION', '[0-9.]+'" monoranks.php | grep -oE '[0-9.]+' | tail -1)
          R=$(grep -oE 'Stable tag: [0-9.]+' readme.txt | awk '{print $3}')
          echo "header $H constant $C readme $R"
          test "$H" = "$C" -a "$H" = "$R"
          grep -q "^## \[$H\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $H"; exit 1; }
          grep -q "^= $H =" readme.txt || { echo "readme.txt changelog has no entry for $H"; exit 1; }
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress with the plugin
        run: npx wp-env start
      - name: Pretty permalinks (the REST routes live under /wp-json/)
        run: npx wp-env run cli wp rewrite structure '/%postname%/' --hard
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results
          retention-days: 7
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit, plugin-check, version, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the plugin version
        run: |
          V=$(grep -oE 'Version:\s+[0-9.]+' monoranks.php | awk '{print $2}')
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but plugin is $V"; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: monoranks
          ASSETS_DIR: .wordpress-org
      - name: Attach the zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
          generate_release_notes: true
