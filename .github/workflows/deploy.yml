# A tag v<version> (matching the plugin header) publishes that version to the WordPress.org directory over SVN.
# Secrets: SVN_USERNAME and SVN_PASSWORD (the wordpress.org account that owns the plugin). Runs only after the plugin
# has been approved and the SVN repository exists. .wordpress-org/ holds the directory assets (banner, icon, screenshots).
name: deploy
on:
  push:
    tags: ['v*']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the plugin version
        run: |
          V=$(grep -oE 'Version:\s+[0-9.]+' monoranks.php | awk '{print $2}')
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but plugin is $V"; exit 1; }
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: monoranks
          ASSETS_DIR: .wordpress-org
      - name: Attach the zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
          generate_release_notes: true
