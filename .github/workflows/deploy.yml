name: Deploy

# Publishing a GitHub release tagged v<version> runs the full test suite on that commit and, only when it is green,
# builds the zip with bin/build-zip.sh, pushes the version to the WordPress.org directory over SVN and attaches the zip
# to the release.
#
# The deploy job runs in the `wordpress-org` environment (Settings > Environments; only v* tags may deploy), which holds
# the WordPress.org account that commits to the plugin:
#   - variable SVN_USERNAME (the WordPress.org username)
#   - secret SVN_PASSWORD (that account's SVN password)
# Until WordPress.org has approved the plugin there is no SVN repository to push to, so the SVN step is skipped while
# SVN_USERNAME is unset; the release still gets the zip to submit by hand.
on:
  release:
    types: [published]

concurrency:
  group: deploy-wordpress-org
  cancel-in-progress: false

jobs:
  test:
    name: Tests before deploy
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/monoranks/
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release tag matches the plugin version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(grep -oE 'Version:[[:space:]]+[0-9.]+' monoranks.php | awk '{print $2}')
          test "v$V" = "$TAG" || { echo "Release $TAG but the plugin is $V"; exit 1; }
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The zip is what people install by hand and what app.monoranks.com/downloads/monoranks.zip points at. The script
      # ships production Composer packages only and the committed build/, and fails if npm run build changes build/.
      - name: Build the zip
        run: bash bin/build-zip.sh
      - name: Is WordPress.org set up for this plugin yet?
        id: wporg
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
        run: echo "ready=${SVN_USERNAME:+yes}" >> "$GITHUB_OUTPUT"
      - name: Deploy to WordPress.org
        if: steps.wporg.outputs.ready == 'yes'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: monoranks
          BUILD_DIR: dist/monoranks
          ASSETS_DIR: .wordpress-org
      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/monoranks-${{ steps.version.outputs.value }}.zip
